name: Repo Manager & Bug Inspection

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  code-inspection:
    name: Inspect Code & Detect Bugs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 black

      - name: Compile & Syntax Check (Bug Detection)
        run: |
          echo "Compiling all Python files to detect syntax errors and broken imports..."
          python -m compileall MeowRobot

      - name: Static Code Analysis & Critical Bug Scan
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --ignore=F824 --show-source --statistics

      - name: Code Quality & Complexity Review
        run: |
          # Exit-zero treats formatting as informational
          flake8 . --count --exit-zero --max-complexity=25 --max-line-length=127 --statistics

      - name: Code Formatter (Black Check)
        run: |
          black --check --diff MeowRobot || true

  pr-validator:
    name: Pull Request Verification
    if: github.event_name == 'pull_request'
    needs: code-inspection
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: PR Summary
        run: |
          echo "Pull Request #${{ github.event.pull_request.number }} by @${{ github.actor }} code inspection completed successfully."
